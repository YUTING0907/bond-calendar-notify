name: push_bonds_daily

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 09:17；避开 GitHub Actions 整点高峰。
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: bond-calendar-notify
  cancel-in-progress: false

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVERCHAN_API_KEY: ${{ secrets.SERVERCHAN_API_KEY }}
      NOTIFY_WHEN_EMPTY: "false"
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "$SERVERCHAN_API_KEY" ]; then
            echo "::error::SERVERCHAN_API_KEY is not configured"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Push today's bonds
        run: python bonds.py
